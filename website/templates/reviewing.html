<div class="review-grid">
{% for a in services %}
  <article class="review-card {% if a.recognition %}recognized{% endif %}">
    <h3>{{a.venue}}</h3>
    <p class="review-publisher">{{a.publisher}}</p>
    <p class="review-meta">{{a.role}} · {{a.year}}</p>
    {% if a.recognition %}<p class="award">{% include 'award-icon.html' %} {{a.recognition}}</p>{% endif %}
  </article>
{% endfor %}
</div>
